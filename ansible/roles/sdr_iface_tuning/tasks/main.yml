- name: Raise net.core.wmem_max for SDR traffic
  ansible.builtin.command:
    cmd: "sysctl -w net.core.wmem_max={{ sdr_iface_wmem_max }}"
  changed_when: true

- name: Raise net.core.rmem_max for SDR traffic
  ansible.builtin.command:
    cmd: "sysctl -w net.core.rmem_max={{ sdr_iface_rmem_max }}"
  changed_when: true

- name: Find SDR-facing interface
  ansible.builtin.shell: |
    set -o pipefail
    ip -o -4 addr show | awk -v a="{{ sdr_iface_address }}" '$4 ~ "^" a "/" {print $2; exit}'
  args:
    executable: /bin/bash
  register: sdr_iface
  changed_when: false

- name: Fail if SDR interface not found
  ansible.builtin.fail:
    msg: "No interface with address {{ sdr_iface_address }} found"
  when: sdr_iface.stdout == ""

- name: Set SDR interface MTU
  ansible.builtin.command:
    cmd: "ip link set dev {{ sdr_iface.stdout }} mtu {{ sdr_iface_mtu }}"
  changed_when: true

- name: Install cpupower
  ansible.builtin.apt:
    name: linux-tools-generic
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Disable deep CPU C-states
  ansible.builtin.command:
    cmd: cpupower idle-set -D 2
  changed_when: true

- name: Disable hyperthreading (SMT)
  ansible.builtin.copy:
    dest: /sys/devices/system/cpu/smt/control
    content: "off"
    mode: "0644"
